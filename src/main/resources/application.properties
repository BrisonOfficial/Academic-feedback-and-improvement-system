spring.application.name=AFIMS

# ===============================
# MySQL Database
# ===============================
# Replace YOUR_MYSQL_PASSWORD with your local MySQL root password.
spring.datasource.url=jdbc:mysql://localhost:3306/afims_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=brisonb2007

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SQL Initialization
# ===============================
spring.sql.init.mode=never

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# MVC
# ===============================
spring.mvc.hiddenmethod.filter.enabled=true

# ===============================
# Error Handling
# ===============================
server.error.whitelabel.enabled=false
